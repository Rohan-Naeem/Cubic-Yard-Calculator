<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="cyLogoTitle">
  <title id="cyLogoTitle">Cubic Yard Calculator</title>
  <g fill="none" stroke="#0B1220" stroke-width="1.6" stroke-linejoin="round">
    <!-- top face -->
    <polygon points="8,15 24,6 40,15 24,24" fill="#DCEAFE"/>
    <!-- left face -->
    <polygon points="8,15 24,24 24,42 8,33" fill="#CBD5E1"/>
    <!-- right face -->
    <polygon points="24,24 40,15 40,33 24,42" fill="#1E293B"/>
  </g>
  <!-- measurement tick line along left-front edge -->
  <g stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round">
    <line x1="4" y1="15" x2="4" y2="33"/>
    <line x1="2.4" y1="15" x2="5.6" y2="15"/>
    <line x1="2.4" y1="24" x2="5.6" y2="24"/>
    <line x1="2.4" y1="33" x2="5.6" y2="33"/>
  </g>
  <!-- center volume point -->
  <circle cx="24" cy="24" r="1.6" fill="#F59E0B"/>
</svg>
